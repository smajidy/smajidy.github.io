{%- assign image = site.data.images[include.id] -%}
<img src="{{ image.src | relative_url }}" srcset="{% for variant in image.variants %}{{ variant.path | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '100vw' }}" alt="{{ include.alt | escape }}" width="{{ include.width | default: image.width }}" height="{{ include.height | default: image.height }}"{% if include.class %} class="{{ include.class }}"{% endif %} decoding="async" loading="{{ include.loading | default: 'lazy' }}"{% if include.fetchpriority %} fetchpriority="{{ include.fetchpriority }}"{% endif %}>
