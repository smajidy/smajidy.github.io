# Site identity and URLs
locale: en-US
title: Shayan Majidy
title_separator: '-'
name: Shayan Majidy
description: Pronounced shah-YAHN mah-JEE-dee
url: https://smajidy.github.io
baseurl: ''
repository: smajidy.github.io

# Author and existing structured metadata
author:
  name: Shayan Majidy
  email: smajidy@fas.harvard.edu
social:
  type: null
  name: null
  links: null
atom_feed:
  path: null

# Source discovery and build behaviour
future: true
include:
- .htaccess
- _pages
- files
exclude:
- '*.sublime-project'
- '*.sublime-workspace'
- .asset-cache
- .bundle
- .jekyll-assets-cache
- .sass-cache
- CHANGELOG
- Capfile
- Gemfile
- Gruntfile.js
- LICENSE
- README
- Rakefile
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- config
- gulpfile.js
- log
- node_modules
- package.json
- tmp
- vendor
keep_files:
- .git
- .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
collections: {}

# Markdown conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Page layout and styling
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: single

# Output and existing generated URLs
permalink: /:categories/:title/
timezone: America/Los_Angeles
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-gist
- jekyll-feed
- jekyll-redirect-from
whitelist:
- jekyll-paginate
- jekyll-sitemap
- jekyll-gist
- jekyll-feed
- jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
